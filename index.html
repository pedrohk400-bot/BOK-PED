<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOK PED - فتح حساب</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            BOK PED
        </div>

        <div class="subtitle">
            فتح حساب جديد
        </div>

        <div class="card">

            <label for="username">
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                placeholder="أدخل اسم المستخدم"
                autocomplete="username"
            >

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="new-password"
            >

            <button id="createAccount" type="button">
                فتح الحساب
            </button>

            <div id="message"></div>

        </div>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
