<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOK-PED | فتح حساب</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <div class="logo">
            BOK-PED
        </div>

        <p class="subtitle">
            فتح حساب جديد
        </p>


        <div class="card">

            <label for="username">
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                placeholder="اكتب اسم المستخدم"
                autocomplete="username"
            >


            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="اكتب كلمة المرور"
                autocomplete="new-password"
            >


            <label for="confirmPassword">
                تأكيد كلمة المرور
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                autocomplete="new-password"
            >


            <button id="createAccount">
                فتح الحساب
            </button>


            <p id="message"></p>

        </div>

    </div>


    <!-- Firebase / JavaScript -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>

</html>
