<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOK-PED | فتح حساب</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./style.css?v=2026082001"
    >

</head>


<body>

    <div class="container">

        <!-- الشعار -->
        <div class="logo">
            BOK-PED
        </div>


        <!-- العنوان -->
        <p class="subtitle">
            فتح حساب جديد
        </p>


        <!-- البطاقة -->
        <div class="card">


            <!-- اسم المستخدم -->
            <label for="username">
                اسم المستخدم
            </label>

            <input
                type="text"
                id="username"
                placeholder="اكتب اسم المستخدم"
                autocomplete="username"
                required
            >


            <!-- كلمة المرور -->
            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="اكتب كلمة المرور"
                autocomplete="new-password"
                required
            >


            <!-- زر فتح الحساب -->
            <button
                type="button"
                id="createAccount"
            >
                فتح الحساب
            </button>


            <!-- الرسالة -->
            <p id="message"></p>


        </div>

    </div>


    <!-- Firebase / JavaScript -->
    <script
        type="module"
        src="./app.js?v=2026082001"
    ></script>


</body>

</html>
